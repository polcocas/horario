<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario de Clases</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Horario de Clases</h1>
  </header>

  <main class="container">
    <!-- Botón Calendario Moodle -->
    <div class="card">
      <h2>Calendario Moodle</h2>
      <button onclick="window.location.href='https://moodle4.net.fje.edu/my/'">
        Abrir Calendario
      </button>
    </div>

    <!-- Espacio para el horario -->
    <div class="card">
      <h2>Mi Horario</h2>
      <div class="calendar-container">
        <!-- Imagen del horario -->
        <img src="horario.png" alt="Horario de clases" usemap="#horario-map">

        <!-- Áreas clicables encima de cada casilla -->
        <map name="horario-map">
          <area target="_blank" alt="M03" title="M03"
            href="https://moodle4.net.fje.edu/course/view.php?id=1122"
            coords="85,5,787,6,788,139,84,138" shape="poly">

          <area target="_blank" alt="M01" title="M01"
            href="https://moodle4.net.fje.edu/course/view.php?id=1187#module-67664"
            coords="87,141,554,141,554,272,319,274,319,406,83,406" shape="poly">

          <area target="_blank" alt="M02" title="M02"
            href="https://moodle4.net.fje.edu/admin/tool/catalogue/courseinfo.php?id=1134"
            coords="553,140,1022,140,1022,407,557,405" shape="poly">

          <area target="_blank" alt="M06" title="M06"
            href="https://moodle4.net.fje.edu/course/view.php?id=1131"
            coords="320,274,553,273,555,405,322,405,319,351" shape="poly">

          <area target="_blank" alt="M06" title="M06"
            href="https://moodle4.net.fje.edu/course/view.php?id=1131"
            coords="789,6,1020,8,1022,140,788,140" shape="poly">
        </map>
      </div>
    </div>
  </main>
</body>
</html>
